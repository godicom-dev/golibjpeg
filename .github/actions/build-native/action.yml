name: Build native library
description: Build golibjpeg shared library and copy to native/libs/

inputs:
  embed-name:
    description: Output filename under native/libs/
    required: true
  osx-architectures:
    description: >
      CMAKE_OSX_ARCHITECTURES for a macOS build, e.g. x86_64. Empty means build
      for the runner's own architecture. Apple's clang cross-compiles between
      arm64 and x86_64 out of the box, so one arm64 runner produces both thin
      dylibs.
    required: false
    default: ""
  msvc-arch:
    description: >
      Target for ilammy/msvc-dev-cmd on Windows. x64 builds for the runner;
      amd64_arm64 selects the x64-hosted ARM64 cross toolchain, which is how the
      arm64 DLL is produced without an arm64 build runner.
    required: false
    default: x64

runs:
  using: composite
  steps:
    - name: Windows - setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        # A caller that threads an unset matrix value through lands here as the
        # empty string, which would override the default rather than fall back
        # to it.
        arch: ${{ inputs.msvc-arch || 'x64' }}

    - name: Windows - CMake configure + build
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cmake -S lib -B lib/build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build lib/build --config Release

    - name: Windows - copy
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p native/libs
        cp lib/build/golibjpeg.dll "native/libs/${{ inputs.embed-name }}"

    # Same reasoning as the macOS check below: a DLL built for the wrong machine
    # loads nowhere, and nothing downstream would notice.
    - name: Windows - verify the architecture
      if: runner.os == 'Windows'
      shell: bash
      env:
        MSVC_ARCH: ${{ inputs.msvc-arch }}
      run: |
        set -euo pipefail
        lib="native/libs/${{ inputs.embed-name }}"
        # // rather than / so MSYS does not rewrite the switch as a path.
        dumpbin //HEADERS "$lib" | grep -i "machine ("
        case "$MSVC_ARCH" in
          *arm64) want="ARM64" ;;
          *)      want="x64" ;;
        esac
        dumpbin //HEADERS "$lib" | grep -i "machine (" | grep -qi "$want"

    - name: Unix - CMake configure + build
      if: runner.os != 'Windows'
      shell: bash
      env:
        OSX_ARCHITECTURES: ${{ inputs.osx-architectures }}
      run: |
        set -euo pipefail
        # Built as an array rather than a string so the arch flag can be omitted
        # entirely; it is never empty, which keeps `set -u` happy on the bash 3.2
        # that ships with macOS.
        args=(-S lib -B lib/build_nix
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON)
        if [ -n "$OSX_ARCHITECTURES" ]; then
          args+=(-DCMAKE_OSX_ARCHITECTURES="$OSX_ARCHITECTURES")
        fi
        cmake "${args[@]}"
        cmake --build lib/build_nix --config Release

    - name: Unix - copy (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p native/libs
        cp lib/build_nix/libgolibjpeg.so "native/libs/${{ inputs.embed-name }}"

    - name: Unix - copy (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p native/libs
        cp lib/build_nix/libgolibjpeg.dylib "native/libs/${{ inputs.embed-name }}"

    # A cross-compiled dylib that silently came out as the host architecture
    # would load nowhere and would not be caught until someone ran it, so check
    # the file rather than trusting the flag.
    - name: macOS - verify the architecture
      if: runner.os == 'macOS'
      shell: bash
      env:
        OSX_ARCHITECTURES: ${{ inputs.osx-architectures }}
      run: |
        set -euo pipefail
        lib="native/libs/${{ inputs.embed-name }}"
        lipo -info "$lib"
        want="${OSX_ARCHITECTURES:-$(uname -m)}"
        lipo -info "$lib" | grep -qw "$want"
