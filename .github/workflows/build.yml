name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-build:
    name: cross-build (no prebuilt library)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      # A platform with no prebuilt library still has to compile: decoding and
      # encoding return ErrUnsupportedPlatform at run time, so importing this
      # module stays safe everywhere Go and purego build. Without this job the
      # guarantee holds only until someone puts a symbol in the wrong file.
      - name: Build where no prebuilt library exists
        run: |
          set -euo pipefail
          for target in \
            windows/arm64 windows/386 \
            linux/386 linux/arm linux/riscv64 linux/ppc64le \
            js/wasm wasip1/wasm; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  build-native:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            embed-name: golibjpeg_amd64.dll
          - name: linux-amd64
            os: ubuntu-24.04
            embed-name: golibjpeg_linux_amd64.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            embed-name: golibjpeg_linux_arm64.so
          - name: darwin-arm64
            os: macos-latest
            embed-name: golibjpeg_darwin_arm64.dylib
          # Cross-compiled on the same arm64 runner: Apple's clang targets both
          # architectures, so this needs no x86_64 hardware. Thin rather than a
          # universal dylib, because //go:embed puts whatever is here into every
          # user's binary and a universal file would double that for both Macs.
          - name: darwin-amd64
            os: macos-latest
            embed-name: golibjpeg_darwin_amd64.dylib
            osx-architectures: x86_64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native library
        uses: ./.github/actions/build-native
        with:
          embed-name: ${{ matrix.embed-name }}
          osx-architectures: ${{ matrix.osx-architectures }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.embed-name }}
          path: native/libs/${{ matrix.embed-name }}

  commit-native:
    name: commit native/libs
    needs: [build-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Update native/libs
        run: |
          mkdir -p native/libs
          cp artifacts/* native/libs/
          ls -la native/libs/

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update prebuilt native libraries"
          file_pattern: native/libs/*

  test:
    name: test (${{ matrix.name }})
    needs: [build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            goarch: amd64
            embed-name: golibjpeg_amd64.dll
          - name: linux-amd64
            os: ubuntu-24.04
            goarch: amd64
            embed-name: golibjpeg_linux_amd64.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
            embed-name: golibjpeg_linux_arm64.so
          - name: darwin-arm64
            os: macos-latest
            goarch: arm64
            embed-name: golibjpeg_darwin_arm64.dylib
          # The runner is arm64, so this compiles amd64 test binaries and leans
          # on Rosetta 2 to run them. The alternative is shipping a library no
          # test ever loads.
          - name: darwin-amd64
            os: macos-latest
            goarch: amd64
            embed-name: golibjpeg_darwin_amd64.dylib

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.embed-name }}
          path: native/libs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch conformance testdata
        run: bash scripts/fetch-testdata.sh

      - name: Go test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test -v ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          make_latest: true
