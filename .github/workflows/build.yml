name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: checks (fmt, vet, embed)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: gofmt
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt-clean:"
            echo "$out"
            gofmt -d .
            exit 1
          fi

      # `go test` runs a subset of vet, and unsafeptr is not in it, which is how a
      # vet failure sat in this repo under a green CI.
      - name: go vet
        run: go vet ./...

      # A program that imports golibjpeg must carry exactly one native library:
      # the one for the platform it was built for. Per-platform build tags on the
      # //go:embed files are what make that true, and the invariant is one
      # careless `libs/*` glob or one missing build tag away from putting all six
      # libraries into every binary — around 10 MB of libraries where 1.4 MB
      # belongs. go list reports the embed set for a target without building it,
      # so this is checkable directly rather than by weighing binaries.
      - name: One embedded library per platform
        run: |
          set -euo pipefail
          fail=0
          expect() {
            local goos="$1" goarch="$2" want="$3"
            # native/libs/ is filled in by commit-native on main, so a PR that
            # adds a platform names a library the branch does not have yet.
            # Report that as pending instead of broken; every platform whose
            # library is present is still checked.
            local file="native/$(printf '%s' "$want" | tr -d '[]')"
            if [ "$want" != "[]" ] && [ ! -f "$file" ]; then
              printf '%-14s pending (%s not committed yet)\n' "$goos/$goarch" "$file"
              return 0
            fi
            local got
            got=$(GOOS="$goos" GOARCH="$goarch" go list -f '{{.EmbedFiles}}' ./native)
            printf '%-14s %s\n' "$goos/$goarch" "$got"
            if [ "$got" != "$want" ]; then
              printf '%-14s WANT %s\n' "" "$want"
              fail=1
            fi
          }
          expect linux   amd64 '[libs/golibjpeg_linux_amd64.so]'
          expect linux   arm64 '[libs/golibjpeg_linux_arm64.so]'
          expect darwin  amd64 '[libs/golibjpeg_darwin_amd64.dylib]'
          expect darwin  arm64 '[libs/golibjpeg_darwin_arm64.dylib]'
          expect windows amd64 '[libs/golibjpeg_amd64.dll]'
          expect windows arm64 '[libs/golibjpeg_arm64.dll]'
          # Nothing embedded off the matrix, so those binaries pay nothing.
          expect linux   386   '[]'
          expect windows 386   '[]'
          expect js      wasm  '[]'
          exit $fail

  cross-build:
    name: cross-build (no prebuilt library)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      # A platform with no prebuilt library still has to compile: decoding and
      # encoding return ErrUnsupportedPlatform at run time, so importing this
      # module stays safe everywhere Go and purego build. Without this job the
      # guarantee holds only until someone puts a symbol in the wrong file.
      - name: Build where no prebuilt library exists
        run: |
          set -euo pipefail
          for target in \
            windows/386 \
            linux/386 linux/arm linux/riscv64 linux/ppc64le \
            js/wasm wasip1/wasm; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  build-native:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            msvc-arch: x64
            embed-name: golibjpeg_amd64.dll
          # Cross-compiled with MSVC's x64-hosted ARM64 toolchain, so the build
          # needs no arm64 runner. The test job below does use one.
          - name: windows-arm64
            os: windows-latest
            msvc-arch: amd64_arm64
            embed-name: golibjpeg_arm64.dll
          - name: linux-amd64
            os: ubuntu-24.04
            embed-name: golibjpeg_linux_amd64.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            embed-name: golibjpeg_linux_arm64.so
          - name: darwin-arm64
            os: macos-latest
            embed-name: golibjpeg_darwin_arm64.dylib
          # Cross-compiled on the same arm64 runner: Apple's clang targets both
          # architectures, so this needs no x86_64 hardware. Thin rather than a
          # universal dylib, because //go:embed puts whatever is here into every
          # user's binary and a universal file would double that for both Macs.
          - name: darwin-amd64
            os: macos-latest
            embed-name: golibjpeg_darwin_amd64.dylib
            osx-architectures: x86_64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native library
        uses: ./.github/actions/build-native
        with:
          embed-name: ${{ matrix.embed-name }}
          osx-architectures: ${{ matrix.osx-architectures }}
          msvc-arch: ${{ matrix.msvc-arch }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.embed-name }}
          path: native/libs/${{ matrix.embed-name }}

  commit-native:
    name: commit native/libs
    needs: [build-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Update native/libs
        run: |
          mkdir -p native/libs
          cp artifacts/* native/libs/
          ls -la native/libs/

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update prebuilt native libraries"
          file_pattern: native/libs/*

  test:
    name: test (${{ matrix.name }})
    needs: [build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            goarch: amd64
            embed-name: golibjpeg_amd64.dll
          # A real arm64 Windows runner, so this is a native run rather than a
          # cross-build check: purego'''s Windows ARM64 path is exercised for real.
          - name: windows-arm64
            os: windows-11-arm
            goarch: arm64
            embed-name: golibjpeg_arm64.dll
          - name: linux-amd64
            os: ubuntu-24.04
            goarch: amd64
            embed-name: golibjpeg_linux_amd64.so
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
            embed-name: golibjpeg_linux_arm64.so
          - name: darwin-arm64
            os: macos-latest
            goarch: arm64
            embed-name: golibjpeg_darwin_arm64.dylib
          # The runner is arm64, so this compiles amd64 test binaries and leans
          # on Rosetta 2 to run them. The alternative is shipping a library no
          # test ever loads.
          - name: darwin-amd64
            os: macos-latest
            goarch: amd64
            embed-name: golibjpeg_darwin_amd64.dylib

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.embed-name }}
          path: native/libs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch conformance testdata
        run: bash scripts/fetch-testdata.sh

      - name: Go test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test -v ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          make_latest: true
